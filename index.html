<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Line Tracker</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1f3b57">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f5f8;color:#222}
header{background:#1f3b57;color:#fff;padding:10px 14px;font-size:18px;font-weight:600}
.wrap{max-width:560px;margin:0 auto;padding:8px}
.card{background:#fff;border-radius:12px;padding:10px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
@keyframes fl{0%,100%{opacity:1}50%{opacity:.1}}.flash{animation:fl 1s infinite}
svg{width:100%;height:auto;display:block;touch-action:manipulation}
label{font-size:14px;color:#555}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
input,select,button{font-size:16px;padding:7px 8px;border:1px solid #bbb;border-radius:8px;background:#fff}
input[type=number]{width:80px}
button{background:#1f6fd1;color:#fff;border:none}
button.grey{background:#777}button.red{background:#c62828}
.big{font-size:15px;line-height:1.5}
.mk{border-top:1px solid #eee;padding:6px 0;font-size:14px}
.mk b{color:#c62828}
.hint{font-size:13px;color:#777}
</style></head><body>
<header>Powder Coat Line Tracker</header>
<div class="wrap">
<div class="card">
<svg id="svg" viewBox="60 20 580 985">
 <g stroke="#111" stroke-width="3" fill="none">
  <path d="M80 270 V632 H305 M80 270 H382 M148 275 V575 M305 270 V632 M382 310 V632 H360"/>
  <path d="M435 640 V325 H563 V640 M435 677 H563 M497 365 V677"/>
 </g>
 <path d="M475 272 H390 L440 195" stroke="#9ACD32" stroke-width="3" fill="none"/>
 <path id="line" fill="none" stroke="#7cc0e6" stroke-width="9" stroke-linejoin="round"
 d="M100.0,51.0 Q100,35 116.0,35.0 L604.0,35.0 Q620,35 620.0,51.0 L620.0,724.0 Q620,740 604.0,740.0 L294.0,740.0 Q278,740 278.0,756.0 L278.0,904.0 Q278,920 294.0,920.0 L604.0,920.0 Q620,920 620.0,936.0 L620.0,969.0 Q620,985 604.0,985.0 L216.0,985.0 Q200,985 200.0,969.0 L200.0,711.0 Q200,695 216.0,695.0 L564.0,695.0 Q580,695 580.0,679.0 L580.0,671.0 Q580,655 564.0,655.0 L546.0,655.0 Q530,655 530.0,639.0 L530.0,358.0 Q530,342 514.0,342.0 L476.0,342.0 Q460,342 460.0,358.0 L460.0,634.0 Q460,650 444.0,650.0 L361.0,650.0 Q345,650 345.0,634.0 L345.0,311.0 Q345,295 361.0,295.0 L564.0,295.0 Q580,295 580.0,279.0 L580.0,91.0 Q580,75 564.0,75.0 L373.0,75.0 Q357,75 357.0,91.0 L357.0,104.0 Q357,120 373.0,120.0 L524.0,120.0 Q540,120 540.0,136.0 L540.0,234.0 Q540,250 524.0,250.0 L436.0,250.0 Q420,250 427.9,236.1 L452.1,193.9 Q460,180 444.0,180.0 L315.5,180.0 Q305,180 305.0,169.5 L305.0,167.5 Q305,157 294.5,157.0 L275.5,157.0 Q265,157 265.0,167.5 L265.0,169.5 Q265,180 254.5,180.0 L216.0,180.0 Q200,180 200.0,164.0 L200.0,136.0 Q200,120 216.0,120.0 L309.0,120.0 Q325,120 325.0,104.0 L325.0,91.0 Q325,75 309.0,75.0 L151.0,75.0 Q135,75 135.0,91.0 L135.0,582.0 Q135,598 151.0,598.0 L184.0,598.0 Q200,598 200.0,582.0 L200.0,313.0 Q200,297 216.0,297.0 L246.0,297.0 Q262,297 262.0,313.0 L262.0,602.0 Q262,618 246.0,618.0 L116.0,618.0 Q100,618 100.0,602.0 Z"/>
 <g font-weight="bold" font-style="italic" fill="#f5a623" font-size="22">
  <text transform="translate(180,460) rotate(-90)">Oven</text>
  <text transform="translate(332,585) rotate(-90)">Drying Oven</text>
  <text transform="translate(488,640) rotate(-90)">Pre Treatment Tank</text>
 </g>
 <text transform="translate(378,268) rotate(-58)" fill="#9ACD32" font-size="13" font-weight="bold">Spray Booth</text>
 <g stroke="#000" stroke-width="5" fill="#fff">
  <rect x="68" y="882" width="110" height="122"/><rect x="580" y="764" width="60" height="148"/></g>
 <g font-weight="bold" font-style="italic" fill="#f5c400" font-size="24">
  <text transform="translate(132,990) rotate(-90)">Loading</text>
  <text transform="translate(602,780) rotate(90)">Unloading</text></g>
 <g id="marks"></g>
</svg>
<div class="hint">Tap the blue line to drop a marker. Solid = where it is now. Flashing = where it will be at the time you pick.</div>
</div>

<div class="card">
 <div class="row"><label>Line speed</label><input id="speed" type="number" step="0.1" min="0.1" value="1.2"><label>m/min</label></div>
 <div class="row"><label>Show markers at</label>
  <select id="hh"></select>:<select id="mm"></select><select id="ap"><option>AM</option><option>PM</option></select>
  <select id="day"><option value="0">Today</option><option value="1">Tomorrow</option><option value="-1">Yesterday</option></select>
 </div>
 <div class="row"><button id="show">Show</button><button id="live" class="grey">Live (now)</button></div>
 <div id="status" class="big"></div>
</div>

<div class="card"><div class="big"><b>Markers</b></div><div id="list"></div>
 <div class="row"><button id="clear" class="red">Clear all markers</button></div></div>

<div class="card hint" id="info"></div>
</div>
<script>
const line=document.getElementById('line'),svg=document.getElementById('svg'),marksG=document.getElementById('marks');
const L=line.getTotalLength(),N=3000,pts=[];
for(let i=0;i<=N;i++){const p=line.getPointAtLength(L*i/N);pts.push([p.x,p.y,L*i/N]);}
function nearest(x,y){let b=1e9,bl=0;for(const p of pts){const d=(p[0]-x)**2+(p[1]-y)**2;if(d<b){b=d;bl=p[2];}}return{l:bl,d:Math.sqrt(b)};}
// Checkpoints (times in minutes at 1.2 m/min, measured from the loading point)
const CP=[['Loading point',200,885],['Pre-treatment in',575,655],['Pre-treatment out',450,650],['Drying oven out',378,295],
 ['Spray booth',480,250],['Oven in',135,262],['Oven out',100,290],['Unloading',585,920]];
const cl=CP.map(c=>nearest(c[1],c[2]).l);const L0=cl[0];
const rel=l=>((l-L0)%L+L)%L;const cr=cl.map(rel); // path length from loading point
const g2y1=cr[5]-cr[4],y2g3=cr[7]-cr[6],g3end=L-cr[7];
const rate=95/(g2y1+y2g3); // min per px on the unmeasured open conveyor
const T=[0,15,30,40,75,0,0,210];T[5]=75+g2y1*rate;T[6]=T[5]+40;
const TOTAL=210+g3end*rate; // full loop minutes at 1.2
const knots=cr.map((r,i)=>[r,T[i]]).concat([[L,TOTAL]]);
function relToT(r){for(let i=0;i<knots.length-1;i++){const a=knots[i],b=knots[i+1];if(r>=a[0]&&r<=b[0])return a[1]+(r-a[0])/(b[0]-a[0])*(b[1]-a[1]);}return 0;}
function tToRel(t){t=((t%TOTAL)+TOTAL)%TOTAL;for(let i=0;i<knots.length-1;i++){const a=knots[i],b=knots[i+1];if(t>=a[1]&&t<=b[1])return a[0]+(t-a[1])/(b[1]-a[1])*(b[0]-a[0]);}return 0;}
function tToXY(t){const p=line.getPointAtLength((tToRel(t)+L0)%L);return[p.x,p.y];}
const BASE=1.2;const COLS=['#e53935','#1e40af','#2e7d32','#ef6c00','#8e24aa','#d81b60','#6d4c41','#00897b'];const col=i=>COLS[i%COLS.length];
let markers=JSON.parse(localStorage.getItem('plt_markers')||'[]');
let speed=parseFloat(localStorage.getItem('plt_speed')||'1.2');document.getElementById('speed').value=speed;
let viewTime=null; // null = live
const save=()=>{localStorage.setItem('plt_markers',JSON.stringify(markers));localStorage.setItem('plt_speed',speed);};
const fmt=d=>d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit',hour12:true});
const fmtD=d=>{const t=new Date();t.setHours(0,0,0,0);const x=new Date(d);x.setHours(0,0,0,0);const k=Math.round((x-t)/864e5);return fmt(d)+(k==0?'':k==1?' tomorrow':k==-1?' yesterday':' '+d.toLocaleDateString());};
const mins=(t)=>{t=Math.round(t);const h=Math.floor(t/60),m=t%60;return h?h+' h '+m+' min':m+' min';};
// marker position in "base minutes" at time now
function posAt(m,when){return m.t0+(when-m.hung)/60000*speed/BASE;}
function stationOf(t){t=((t%TOTAL)+TOTAL)%TOTAL;if(t>=T[5]&&t<T[6])return 'in the oven';if(t>=T[1]&&t<T[2])return 'in pre-treatment';
 if(t>=T[2]&&t<T[3])return 'in the drying oven';let n=null;for(let i=0;i<CP.length;i++)if(T[i]>t){n=i;break;}return 'heading to '+(n===null?CP[0][0]:CP[n][0]).toLowerCase();}
function info(m,when){const t=posAt(m,when);const tm=((t%TOTAL)+TOTAL)%TOTAL;const laps=Math.floor(t/TOTAL);
 let nxt='';for(let k=1;k<=CP.length;k++){const idx=k%CP.length;let tt=T[idx]+(idx===0?TOTAL:0);if(tt<=tm)continue;
  nxt=`${CP[idx][0]} at ${fmtD(new Date(when+(tt-tm)*BASE/speed*60000))}`;break;}
 if(when<m.hung)return 'not dropped yet';
 return `${stationOf(tm)}, ${Math.round(tm*BASE)} m from loading${laps?` (lap ${laps+1})`:''}. Next: ${nxt}`;}
function dot(x,y,c,cls,lbl){return `<g class="${cls}"><circle cx="${x}" cy="${y}" r="11" fill="${c}" stroke="#fff" stroke-width="3"/><text x="${x+14}" y="${y-10}" font-size="16" font-weight="bold" fill="${c}">${lbl}</text></g>`;}
function draw(){const now=Date.now();marksG.innerHTML='';const list=document.getElementById('list');list.innerHTML='';
 markers.forEach((m,i)=>{const c=col(i);const [x,y]=tToXY(posAt(m,now));
  let h=dot(x,y,c,'',i+1);
  if(viewTime!==null&&viewTime>=m.hung){const [fx,fy]=tToXY(posAt(m,viewTime));h+=dot(fx,fy,c,'flash',i+1);}
  marksG.insertAdjacentHTML('beforeend',h);
  list.insertAdjacentHTML('beforeend',`<div class="mk"><b style="color:${c}">&#9679; Marker ${i+1}</b> dropped ${fmtD(new Date(m.hung))}<br>
   <b style="color:${c}">Now:</b> ${info(m,now)}
   ${viewTime!==null?`<br><b style="color:${c}">At ${fmtD(new Date(viewTime))} (flashing):</b> ${info(m,viewTime)}`:''}
   <br><button class="grey" style="padding:3px 8px;font-size:13px" onclick="delM(${i})">Remove</button></div>`);});
 if(!markers.length)list.innerHTML='<div class="hint">No markers yet.</div>';
 document.getElementById('status').innerHTML=viewTime!==null?`Solid = now (${fmt(new Date())}). Flashing = <b>${fmtD(new Date(viewTime))}</b>`:`Live: <b>${fmt(new Date())}</b>`;}
window.delM=i=>{markers.splice(i,1);save();draw();};
svg.addEventListener('click',e=>{const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());
 const n=nearest(p.x,p.y);if(n.d>30)return;const now=Date.now();markers.push({t0:relToT(rel(n.l)),hung:now});save();draw();});
document.getElementById('speed').onchange=e=>{const v=parseFloat(e.target.value);if(v>0){
 // keep markers where they are right now, then continue at new speed
 const now=Date.now();markers.forEach(m=>{m.t0=posAt(m,now);m.hung=now;});speed=v;save();draw();}};
const hh=document.getElementById('hh'),mm=document.getElementById('mm'),ap=document.getElementById('ap'),day=document.getElementById('day');
for(let h=1;h<=12;h++)hh.add(new Option(h,h));for(let m=0;m<60;m+=5)mm.add(new Option(String(m).padStart(2,'0'),m));
(function(){const d=new Date();let h=d.getHours();ap.value=h>=12?'PM':'AM';hh.value=(h%12)||12;mm.value=Math.floor(d.getMinutes()/5)*5;})();
document.getElementById('show').onclick=()=>{let h=parseInt(hh.value)%12;if(ap.value==='PM')h+=12;const d=new Date();d.setDate(d.getDate()+parseInt(day.value));d.setHours(h,parseInt(mm.value),0,0);viewTime=d.getTime();draw();};
document.getElementById('live').onclick=()=>{viewTime=null;draw();};
document.getElementById('clear').onclick=()=>{if(confirm('Clear all markers?')){markers=[];save();draw();}};
document.getElementById('info').innerHTML=`Full loop takes ${mins(TOTAL*BASE/speed)} at the current speed (about ${Math.round(TOTAL*BASE)} m of line). Section times are taken from your arrow timings; loading to unloading is 3 h 30 at 1.2 m/min, and the stretch from unloading back round to loading is estimated.`;
setInterval(draw,5000);draw();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
